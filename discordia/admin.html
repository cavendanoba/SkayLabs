<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — DISCORDIA</title>
  <link rel="icon" type="image/png" href="/discordia/assets/logo-discordia.png">
  <script>
    // Aplica el tema guardado antes de pintar para evitar un destello.
    try { if (localStorage.getItem('discordia-admin-tema') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/discordia/admin.css?v=3">
</head>

<body class="adm">
  <div class="shell">

    <!-- Barra lateral -->
    <aside class="side" id="side">
      <div class="brand">
        <img src="./assets/logo-discordia.png" alt="">
        <div><b>DISCORDIA</b><span>Panel de operación</span></div>
      </div>

      <button class="new-btn" id="nueva-venta" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nueva venta <kbd>N</kbd>
      </button>

      <p class="nav-label">Negocio</p>
      <nav id="admin-tabs-nav" aria-label="Secciones del panel"></nav>

      <div class="side-foot">
        <a class="nav-btn" href="./index.html" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          Ver catálogo
        </a>
        <div class="today" id="side-today" hidden></div>
        <div class="user-chip">
          <span class="avatar" id="user-initials">AD</span>
          <div><b id="user-name">Admin</b><span>Administrador</span></div>
          <button class="circle-btn" id="logout-btn" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- Contenido -->
    <div class="main">
      <header class="top">
        <button class="btn icon menu-btn" id="menu-btn" type="button" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <h1 id="page-title">Resumen</h1>
          <p id="page-sub">Cómo va Discordia</p>
        </div>
        <div class="top-actions">
          <span class="live hide-sm"><i></i><span id="clock">—</span></span>
          <button class="btn icon" id="refresh-btn" type="button" title="Actualizar datos" aria-label="Actualizar datos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
          <button class="btn icon" id="theme-btn" type="button" title="Cambiar tema" aria-label="Cambiar entre tema oscuro y claro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="admin-panel" aria-live="polite"></main>
    </div>
  </div>

  <script type="module" src="/discordia/admin.js?v=4"></script>
</body>

</html>
