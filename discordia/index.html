<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISCORDIA — Catálogo de maquillaje</title>
  <meta name="description" content="Catálogo de maquillaje DISCORDIA en Bogotá. Elige tus favoritos y pídelos por WhatsApp.">
  <script>
    (function () {
      const path = window.location.pathname;
      if (path.endsWith('/discordia')) {
        window.location.replace(path + '/' + window.location.search + window.location.hash);
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="./assets/logo-discordia.png?v=20260226">
  <link rel="apple-touch-icon" href="./assets/logo-discordia.png?v=20260226">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4a1f2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="./catalogo.css?v=5">
</head>
<body>
  <header class="portada">
    <p class="edicion">Catálogo de maquillaje</p>
    <h1>DISCORDIA</h1>
    <p class="bajada">Elige tus favoritos y pídelos por WhatsApp</p>
    <button id="activarBrillos" class="boton-brillos" type="button" hidden></button>
  </header>

  <div class="buscador">
    <label for="buscar" class="oculto">Buscar productos</label>
    <input id="buscar" type="search" placeholder="Buscar por nombre o referencia" autocomplete="off">
  </div>

  <nav id="categorias" class="categorias" aria-label="Categorías"></nav>

  <main id="catalogo" aria-live="polite">
    <p class="vacio">Cargando el catálogo…</p>
  </main>

  <button id="abrirCarrito" class="fab" type="button" aria-haspopup="dialog">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h13l-1.5 9h-10z"/><path d="M6 7 5 3H2"/><circle cx="9" cy="20" r="1.2"/><circle cx="16" cy="20" r="1.2"/></svg>
    <span>Pedido (<span id="contador">0</span>)</span>
  </button>

  <div id="fondoCarrito" class="fondo" hidden></div>
  <aside id="carrito" class="carrito" role="dialog" aria-modal="true" aria-labelledby="tituloCarrito" hidden>
    <div class="carrito-head">
      <h2 id="tituloCarrito">Tu pedido</h2>
      <button id="cerrarCarrito" type="button" aria-label="Cerrar carrito">×</button>
    </div>
    <p id="carritoVacio" class="carrito-vacio">Tu pedido está vacío. Agrega productos desde el catálogo.</p>
    <ul id="items"></ul>
    <p class="total"><span>Total</span><strong id="total">$0</strong></p>
    <button id="enviar" class="whatsapp" type="button">Pedir por WhatsApp</button>
  </aside>

  <dialog id="detalle" class="detalle" aria-labelledby="detalleTitulo">
    <div class="detalle-cuerpo">
      <button id="cerrarDetalle" class="detalle-cerrar" type="button" aria-label="Cerrar detalles">×</button>
      <div>
        <div id="detalleFoto" class="detalle-foto"></div>
        <div id="detalleMiniaturas" class="miniaturas"></div>
      </div>
      <div class="detalle-info">
        <p id="detalleMarca" class="marca"></p>
        <h2 id="detalleTitulo"></h2>
        <p id="detallePrecio" class="precio"></p>
        <p id="detalleTexto" class="detalle-texto"></p>
      </div>
    </div>
  </dialog>

  <script type="module" src="./catalogo.js?v=6"></script>
</body>
</html>
