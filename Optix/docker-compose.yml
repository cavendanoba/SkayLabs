version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: optix-postgres
    environment:
      POSTGRES_USER: optix_user
      POSTGRES_PASSWORD: optix_password_dev
      POSTGRES_DB: optix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optix_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: optix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
