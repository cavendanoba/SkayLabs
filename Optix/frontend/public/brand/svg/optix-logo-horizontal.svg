<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180">
  <defs>
    <radialGradient id="hBg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#d8e3ed"/>
    </radialGradient>
    <radialGradient id="hIcon" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3a5a7a"/>
      <stop offset="100%" stop-color="#0f1e30"/>
    </radialGradient>
    <radialGradient id="hIris" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#aec3d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2b4362" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="hPupil" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#3d6080"/>
      <stop offset="100%" stop-color="#0a0c18"/>
    </radialGradient>
    <radialGradient id="hGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aec3d9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#aec3d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="hBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="hBlur2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="700" height="180" rx="18" fill="url(#hBg)"/>
  <rect width="700" height="180" rx="18" fill="none" stroke="#f2f3f5" stroke-width="2" opacity="0.85"/>
  <rect width="700" height="180" rx="18" fill="none" stroke="#2b4362" stroke-width="0.6" opacity="0.12"/>

  <!-- Sombra ícono -->
  <rect x="32" y="28" width="116" height="116" rx="24" fill="#0a0c18" opacity="0.25" filter="url(#hBlur2)"/>
  <!-- Ícono fondo -->
  <rect x="26" y="22" width="116" height="116" rx="24" fill="url(#hIcon)"/>
  <rect x="26" y="22" width="116" height="116" rx="24" fill="none" stroke="#aec3d9" stroke-width="0.8" opacity="0.22"/>
  <rect x="26" y="22" width="58" height="58" rx="24" fill="#f2f3f5" opacity="0.05"/>

  <!-- Glow ojo -->
  <ellipse cx="84" cy="80" rx="46" ry="28" fill="url(#hGlow)" filter="url(#hBlur)"/>

  <!-- Párpados -->
  <path d="M38 80 Q84 42 130 80"  fill="none" stroke="#0a0c18" stroke-width="5.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M38 80 Q84 42 130 80"  fill="none" stroke="#f2f3f5" stroke-width="3"   stroke-linecap="round"/>
  <path d="M38 80 Q84 118 130 80" fill="none" stroke="#0a0c18" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M38 80 Q84 118 130 80" fill="none" stroke="#cdcbc7" stroke-width="2.2" stroke-linecap="round" opacity="0.82"/>

  <!-- Iris -->
  <circle cx="84" cy="80" r="27" fill="url(#hIris)"/>
  <circle cx="84" cy="80" r="27" fill="none" stroke="#aec3d9" stroke-width="1.8" opacity="0.58"/>
  <circle cx="84" cy="80" r="22" fill="none" stroke="#2b4362"  stroke-width="1"   opacity="0.42"/>

  <!-- Pupila -->
  <circle cx="84" cy="80" r="13" fill="url(#hPupil)"/>
  <circle cx="84" cy="80" r="13" fill="none" stroke="#0a0c18" stroke-width="0.6" opacity="0.8"/>

  <!-- Reflejos -->
  <ellipse cx="91" cy="73" rx="5.5" ry="4" fill="#f2f3f5" opacity="0.96"/>
  <circle  cx="77" cy="87" r="2.2"          fill="#f2f3f5" opacity="0.3"/>

  <!-- Ejes -->
  <line x1="38" y1="80" x2="130" y2="80"  stroke="#aec3d9" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.22"/>
  <line x1="84" y1="42" x2="84"  y2="118" stroke="#aec3d9" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.22"/>

  <!-- Puntos focales -->
  <circle cx="38"  cy="80" r="5.5" fill="#0a0c18" opacity="0.5"/>
  <circle cx="38"  cy="80" r="3.2" fill="#aec3d9"/>
  <circle cx="130" cy="80" r="5.5" fill="#0a0c18" opacity="0.5"/>
  <circle cx="130" cy="80" r="3.2" fill="#aec3d9"/>

  <!-- Divisor -->
  <line x1="162" y1="32"  x2="162" y2="64"  stroke="#2b4362" stroke-width="0.9" opacity="0.12"/>
  <line x1="162" y1="64"  x2="162" y2="116" stroke="#2b4362" stroke-width="0.9" opacity="0.25"/>
  <line x1="162" y1="116" x2="162" y2="148" stroke="#2b4362" stroke-width="0.9" opacity="0.12"/>

  <!-- Texto sombra -->
  <text x="184" y="120" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#0a0c18" opacity="0.1">Optix</text>
  <!-- Texto principal -->
  <text x="182" y="118" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#2b4362">Optix</text>

  <!-- Líneas decorativas -->
  <line x1="182" y1="132" x2="430" y2="132" stroke="#2b4362" stroke-width="1.2" opacity="0.3"/>
  <line x1="430" y1="132" x2="620" y2="132" stroke="#2b4362" stroke-width="0.5" opacity="0.1"/>

  <!-- by SkayLabs -->
  <text x="184" y="155" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="6" fill="#2b4362" opacity="0.52">by SkayLabs</text>

  <!-- Tagline -->
  <text x="678" y="84"  font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2.5" fill="#2b4362" opacity="0.28" text-anchor="end">Clinical Vision</text>
  <text x="678" y="102" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2.5" fill="#2b4362" opacity="0.28" text-anchor="end">Management</text>
</svg>
